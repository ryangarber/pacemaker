name: release

# A dry run after each successful check of a push to main or dev, reporting
# what would be released; a real release when run by hand.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}-v2
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.rylease.outputs.released }}
      version: ${{ steps.rylease.outputs.version }}
      notes: ${{ steps.rylease.outputs.notes }}
      dry-run: ${{ steps.mode.outputs.dry-run }}
      ref: ${{ steps.mode.outputs.ref }}
    steps:
      - id: mode
        run: |
          echo "dry-run=${{ github.event_name != 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.event.workflow_run.head_branch || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.mode.outputs.ref }}
          fetch-depth: 0 # full history is needed to find the previous release
      
      - id: rylease
        uses: ryangarber/rylease@v3
        with:
          dry-run: ${{ steps.mode.outputs.dry-run }}
          steps: |
            - uses: conventional
            - uses: fs/write-changes
              with: { heading: "## {version}" }
            - uses: git/commit

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          - { os: macos-26-intel, target: macos-x64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: windows-latest, target: windows-x64, ext: .exe }
          - { os: windows-11-arm, target: windows-arm64, ext: .exe }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A dry run has no tag, so it builds what it checked.
          ref: ${{ needs.release.outputs.dry-run == 'true' && needs.release.outputs.ref || format('v{0}', needs.release.outputs.version) }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go get .
      - name: Build
        shell: bash
        run: go build -o bin/pacemaker-${{ matrix.target }}${{ matrix.ext }} -ldflags "-X github.com/ryangarber/pacemaker/internal/cli.Version=${{ needs.release.outputs.version }}"
      - uses: ryangarber/rylease@v3
        with:
          version: ${{ needs.release.outputs.version }}
          notes: ${{ needs.release.outputs.notes }}
          dry-run: ${{ needs.release.outputs.dry-run }}
          scheme: semver
          history: git/tags
          steps: |
            - uses: github/upload-release-assets
              with:
                files: ["bin/*"]
                dryRunArtifact: true
